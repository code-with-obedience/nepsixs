<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hover Moving Image Effect</title>
  <link rel="stylesheet" href="hover.css">
</head>
<body>

<section class="wrapper">

  <!-- Moving Image -->
  <div class="image-container">
    <img id="movingImage" src="01.jpg" alt="">
  </div>

  <!-- Columns -->
  <div class="columns">
    <div class="col" data-img="01.jpg">
      <h2>Residential and Signature Properties</h2>
      <p>Luxury homes with premium finishes.</p>
    </div>

    <div class="col" data-img="02.jpg">
      <h2>Professional and Adaptive Spaces</h2>
      <p>Modern workspaces for productivity.</p>
    </div>

    <div class="col" data-img="03.jpg">
      <h2>Hospitality and Wellness Complexes</h2>
      <p>World-class comfort and relaxation.</p>
    </div>
  </div>

</section>

<script src="hover.js"></script>
</body>
</html>
