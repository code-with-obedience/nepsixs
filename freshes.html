<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Hero System</title>

<style>

/* ================= RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f5f5f5;
  font-family: Arial, sans-serif;
}

/* ================= HERO ================= */
.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
  padding: 0 8%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ================= TEXT ================= */
.text {
  max-width: 500px;
  z-index: 5;
}

.text h1 {
  font-size: 70px;
  font-weight: 900;
  line-height: 1;

  /* initial state for animation */
  transform: translateX(-80px);
  opacity: 0;
}

.text button {
  margin-top: 20px;
  padding: 12px 30px;
  background: black;
  color: white;
  border: none;
  cursor: pointer;

  transform: translateY(40px);
  opacity: 0;
}

/* ================= IMAGE ================= */
.image {
  position: relative;
  z-index: 4;
}

.image img {
  width: 420px;

  transform: scale(0.8);
  opacity: 0;
}

/* ================= GREY BOX ================= */
.grey-box {
  position: absolute;
  right: 20%;
  width: 450px;
  height: 320px;
  background: #eaeaea;
  z-index: 2;
}

/* ================= DARK BLOCK ================= */
.dark-block {
  position: absolute;
  right: 10%;
  width: 300px;
  height: 400px;
  background-size: cover;
  background-position: center;
  z-index: 1;

  opacity: 0;
}

/* ================= CIRCLE ================= */
.circle {
  position: absolute;
  width: 600px;
  height: 600px;
  border: 1px solid #ccc;
  border-radius: 50%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 0;
}

/* ================= DOTS ================= */
.dots {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.dot {
  width: 10px;
  height: 10px;
  background: gray;
  border-radius: 50%;
  cursor: pointer;
}

.dot.active {
  background: black;
}

/* ================= ACTIVE ANIMATIONS ================= */

.active h1 {
  transform: translateX(0);
  opacity: 1;
  transition: all 0.8s ease;
}

.active button {
  transform: translateY(0);
  opacity: 1;
  transition: all 0.8s ease 0.2s;
}

.active img {
  transform: scale(1);
  opacity: 1;
  transition: all 0.8s ease 0.3s;
}

.active .dark-block {
  opacity: 1;
  transition: opacity 1s ease;
}

</style>
</head>

<body>

<section class="hero" id="hero">

  <!-- TEXT -->
  <div class="text" id="text">
    <h1></h1>
    <button></button>
  </div>

  <!-- IMAGE -->
  <div class="image">
    <img id="hero-img" src="03.jpg" alt="">
  </div>

  <!-- FIXED LAYERS -->
  <div class="grey-box"></div>
  <div class="dark-block" id="dark"></div>
  <div class="circle"></div>

  <!-- DOTS -->
  <div class="dots" id="dots"></div>

</section>

<script>

/* ================= DATA (THIS IS THE SECRET) ================= */
const slides = [
  {
    title: "ENVISION THE FUTURE",
    button: "EXPLORE",
    image: "03.jpg",
    bg: "h1-slider1-img-2.jpg"
  },
  {
    title: "CREATIVITY ABOVE ALL",
    button: "DISCOVER",
    image: "02.jpg",
    bg: "h1-slider1-img-2.jpg"
  },
  {
    title: "DESIGN YOUR WORLD",
    button: "START NOW",
    image: "01.jpg",
    bg: "h1-slider1-img-2.jpg"
  }
];

/* ================= SELECT ELEMENTS ================= */
const title = document.querySelector("h1");
const button = document.querySelector("button");
const img = document.getElementById("hero-img");
const dark = document.getElementById("dark");
const hero = document.getElementById("hero");
const dotsContainer = document.getElementById("dots");

let current = 0;

/* ================= CREATE DOTS ================= */
slides.forEach((_, i) => {
  const dot = document.createElement("div");
  dot.classList.add("dot");

  dot.addEventListener("click", () => {
    showSlide(i);
  });

  dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll(".dot");

/* ================= SHOW SLIDE ================= */
function showSlide(index) {

  // remove animation
  hero.classList.remove("active");

  setTimeout(() => {

    current = index;

    // CHANGE CONTENT ONLY
    title.textContent = slides[current].title;
    button.textContent = slides[current].button;
    img.src = slides[current].image;
    dark.style.backgroundImage = `url(${slides[current].bg})`;

    // update dots
    dots.forEach(d => d.classList.remove("active"));
    dots[current].classList.add("active");

    // re-trigger animation
    hero.classList.add("active");

  }, 200);
}

/* ================= AUTO PLAY ================= */
setInterval(() => {
  let next = (current + 1) % slides.length;
  showSlide(next);
}, 4000);

/* ================= INITIAL LOAD ================= */
showSlide(0);

</script>

</body>
</html>
